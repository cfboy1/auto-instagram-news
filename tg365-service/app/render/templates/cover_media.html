<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"><style>
.post{width:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--paper)}
.media{height:60%;position:relative;overflow:hidden;background:var(--paper)}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:90px 40px 30px}
.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media .scrim{position:absolute;top:0;left:0;right:0;height:170px;background:linear-gradient(rgba(26,36,64,.6),transparent);z-index:3}
.media .tag{position:absolute;top:130px;right:80px;z-index:4}
.brandbar{position:absolute;top:60px;right:80px;left:80px;display:flex;justify-content:flex-end;align-items:center;z-index:5}
.catstrip{position:absolute;top:calc(60% - 34px);right:80px;z-index:6;background:#fff;color:var(--ink);font-size:42px;font-weight:900;border-radius:10px;padding:14px 44px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.panel{flex:1;background:var(--red);color:#fff;padding:80px 80px 50px;display:flex;flex-direction:column;position:relative;z-index:2}
h1{font-size:76px;font-weight:900;line-height:1.65;margin-top:10px}
.sub{font-size:42px;color:rgba(255,255,255,.9);margin-top:auto;font-weight:700}
.corner{position:absolute;top:0;left:0;width:100%;height:40px;background:var(--ink)}
</style></head><body><div class="post">
<div class="media">
<div class="corner"></div><div class="scrim"></div>
<div class="brandbar"><div class="brand">THE<span class="n365">365</span>NEWS</div></div>
<div class="tag"><span class="badge">⚡ فوری</span></div>
<img src="{{MEDIA}}" alt="">
</div>
<div class="catstrip">{{CATEGORY}}</div>
<div class="panel">
<h1>{{HEADLINE}}</h1>
<div class="sub">{{SUB}}</div>
</div>
</div></body></html>

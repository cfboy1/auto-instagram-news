<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"><style>
.post{width:100%;height:100%;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:120px 90px}
.d1{width:640px;height:640px;top:-200px;left:-180px;opacity:.18;background-image:radial-gradient(circle,rgba(26,36,64,.5) 7px,transparent 8px)}
.stay{font-size:120px;font-weight:900;color:var(--red);line-height:1.3;z-index:2}
.tuned{font-size:120px;font-weight:900;letter-spacing:4px;direction:ltr}
.chip{margin-top:80px;background:var(--red);color:#fff;font-weight:900;font-size:60px;border-radius:22px;padding:34px 70px;direction:ltr;z-index:2}
.flash{position:absolute;bottom:110px;left:80px;right:80px;height:18px;background:repeating-linear-gradient(90deg,var(--red) 0 60px,transparent 60px 90px);opacity:.6}
</style></head><body><div class="post">
<div class="dots d1"></div>
<div class="brandbar"><div class="brand" style="color:var(--ink)">THE<span class="n365">365</span>NEWS</div></div>
<div class="stay">{{TEXT}}</div>
<div class="tuned outline" style="-webkit-text-stroke:4px var(--ink)">STAY TUNED</div>
<div class="chip">@THE365NEWS</div>
<div class="flash"></div>
</div></body></html>

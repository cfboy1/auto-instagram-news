<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"><style>
.post{width:100%;height:100%;background:var(--red);color:#fff;padding:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.d1{width:700px;height:700px;top:-220px;left:-200px;opacity:.35}
.d2{width:520px;height:520px;bottom:-180px;right:-160px;opacity:.25}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 90px;z-index:2}
h1{font-size:112px;font-weight:900;line-height:1.55;margin-top:50px}
.sub{font-size:44px;color:rgba(255,255,255,.85);margin-top:40px;font-weight:700}
.big{position:absolute;bottom:190px;left:80px;right:80px;text-align:center;font-size:120px;font-weight:900;letter-spacing:6px;direction:ltr;z-index:2}
.flash{position:absolute;bottom:120px;left:0;right:0;height:22px;background:repeating-linear-gradient(90deg,#fff 0 60px,transparent 60px 90px);opacity:.5;z-index:2}
</style></head><body><div class="post">
<div class="dots d1"></div><div class="dots d2"></div>
<div class="brandbar"><div class="brand">THE<span class="n365">365</span>NEWS</div><div class="live">● LIVE</div></div>
<div class="mid">
<div><span class="badge">{{TAG}}</span></div>
<h1>{{HEADLINE}}</h1>
<div class="sub">{{SUB}}</div>
</div>
<div class="big outline">THE365NEWS</div>
<div class="flash"></div>
</div></body></html>

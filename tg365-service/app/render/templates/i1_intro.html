<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"><style>
.post{width:100%;height:100%;background:var(--red);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}
.d1{width:720px;height:720px;top:-240px;right:-220px;opacity:.35}
.d2{width:520px;height:520px;bottom:-180px;left:-160px;opacity:.25}
.w1{font-size:200px;font-weight:900;line-height:1.25;z-index:2}
.w2{font-size:200px;font-weight:900;-webkit-text-stroke:6px #fff;z-index:2}
.live{position:absolute;top:70px;left:80px;z-index:2}
</style></head><body><div class="post">
<div class="dots d1"></div><div class="dots d2"></div>
<div class="live"><span class="badge">● LIVE</span></div>
<div class="w1">خبر</div><div class="w2">فوری</div>
</div></body></html>

<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"><style>
.post{width:100%;height:100%;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.d1{width:640px;height:640px;top:-200px;left:-180px;opacity:.16;background-image:radial-gradient(circle,rgba(26,36,64,.5) 7px,transparent 8px)}
.t{font-family:'Arial','DejaVu Sans',sans-serif;font-size:110px;font-weight:900;color:var(--red);letter-spacing:3px;direction:ltr}
.t .n365{color:var(--ink)}
.s{font-size:56px;font-weight:900;margin-top:40px;-webkit-text-stroke:3px var(--ink)}
.flash{position:absolute;bottom:110px;left:80px;right:80px;height:18px;background:repeating-linear-gradient(90deg,var(--red) 0 60px,transparent 60px 90px);opacity:.6}
</style></head><body><div class="post">
<div class="dots d1"></div>
<div class="t">THE<span class="n365">365</span>NEWS</div>
<div class="s">مهمترین اخبار امروز</div>
<div class="flash"></div>
</div></body></html>

<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"><style>
.post{width:100%;height:100%;background:var(--red);color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;padding:190px 90px 150px}
.d1{width:620px;height:620px;top:-200px;right:-180px;opacity:.3}
.q{font-size:90px;color:#ffd166;line-height:1;z-index:2;margin-top:20px}
.txt{font-family:'Peyda','Shazde',Tahoma,sans-serif;font-size:72px;font-weight:700;line-height:1.85;z-index:2;margin-top:40px}
.src{font-size:44px;font-weight:700;color:rgba(255,255,255,.8);margin-top:50px;z-index:2}
.spacer{flex:1}
.bstrip{height:16px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden;z-index:2}
.bfill{height:100%;background:#fff;border-radius:8px}
</style></head><body><div class="post">
<div class="dots d1"></div>
<div class="brandbar"><div class="brand">THE<span class="n365">365</span>NEWS</div></div>
<div class="q">❝</div>
<div class="txt">{{TEXT}}</div>
<div class="src">{{SRC}}</div>
<div class="spacer"></div>
<div class="bstrip"><div class="bfill" style="width:{{PCT}}%"></div></div>
</div></body></html>
